[project]
name = "bumsaeng-code"
version = "0.1.0"
description = "범생코드 영상의 실행 코드: AI 엔지니어 10주"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"week*/*.py" = ["E402"]  # 주차 스크립트는 _setup으로 경로를 잡은 뒤 import한다
